name: Build Modules

on:
  workflow_dispatch:
    inputs:
      chat_id:
        required: true
        type: string
      branch:
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare-toolchain:
    runs-on: ubuntu-24.04

    env:
      CLANG_VERSION: 10032024

    steps:
      - name: Cache Clang toolchain
        id: cache-clang
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/toolchain
          key: ${{ env.CLANG_VERSION }}-${{ runner.os }}

      - name: Download Clang toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchain"

          curl -fL --retry 5 --retry-delay 3 \
            -o clang.tar.zst \
            "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/${CLANG_VERSION}/neutron-clang-${CLANG_VERSION}.tar.zst"

          tar --zstd -xf clang.tar.zst \
            -C "$GITHUB_WORKSPACE/toolchain"

          rm -f clang.tar.zst

  build:
    needs: prepare-toolchain
    runs-on: ubuntu-24.04

    env:
      TARGET_REF: ${{ inputs.branch }}
      CLANG_VERSION: 10032024

    steps:
      - name: Set timezone
        run: |
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh
          date

      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.REPO }}
          ref: ${{ env.TARGET_REF }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          path: repo
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          grep -Ril "dl.google.com/linux/chrome" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm
      
          for i in {1..5}; do
            echo "Attempt $i/5"
      
            if timeout 3m bash -c '
              sudo DEBIAN_FRONTEND=noninteractive apt-get update &&
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                bison \
                flex \
                libssl-dev \
                python3 \
                python-is-python3 \
                libarchive-tools \
                zstd \
                make \
                unzip \
                zip
            '; then
              echo "Success"
              exit 0
            fi
      
            echo "Timed out. Retrying in 10 seconds..."
            sleep 10
          done
      
          echo "Failed after 5 attempts"
          exit 1

      - name: Setup environment
        run: |
          {
            echo "ARCH=arm64"
            echo "LLVM=1"
            echo "LLVM_IAS=1"
            echo "KBUILD_BUILD_USER=Long"
            echo "PLATFORM_VERSION=12"
            echo "ANDROID_MAJOR_VERSION=s"
            echo "TIME=$(date +%y%m%d)"
          } >> "$GITHUB_ENV"

      - name: Restore Clang toolchain
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/toolchain
          key: ${{ env.CLANG_VERSION }}-${{ runner.os }}

      - name: Setup Clang
        run: |
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"

      - name: Verify Clang
        run: |
          set -euo pipefail

          which clang
          clang --version

      - name: Setup KernelSU
        run: |
          cd repo
          git clone --depth=1 -b v1.1.1 https://github.com/longuirom/KernelSU-Next KernelSU

      - name: Modules prepare
        working-directory: repo
        run: |
          set -euo pipefail

          make exynos9610-m21dd_defconfig

          scripts/config --set-str CONFIG_LOCALVERSION "-LongPlus-${{ matrix.device }}"
          scripts/config -e CONFIG_MODULES
          scripts/config -e CONFIG_ARM64_MODULE_PLTS

          make modules_prepare

      - name: Build NoMount LKM
        working-directory: repo
        run: |
          set -euo pipefail

          REPO="maxsteeel/nomount"

          TAG_URL=$(curl -fsSL -o /dev/null -w '%{url_effective}' \
            "https://github.com/$REPO/releases/latest")

          TAG="${TAG_URL##*/}"

          URLS=$(curl -fsSL \
            "https://github.com/$REPO/releases/expanded_assets/$TAG" |
            grep -oE 'href="[^"]+\.zip"' |
            sed -E 's/href="([^"]+)"/\1/' |
            grep '/releases/download/' |
            sed 's|^/|https://github.com/|' |
            sort -u || true)

          if [ -z "$URLS" ]; then
            echo "No ZIP assets found in latest release!"
            exit 1
          fi

          URL=$(printf '%s\n' "$URLS" | head -n 1)

          FILE_NAME=$(basename "${URL%%\?*}")

          case "$FILE_NAME" in
            *.zip) ;;
            *) FILE_NAME="NoMount.zip" ;;
          esac

          echo "Downloading NoMount ZIP..."

          curl -fL --retry 3 \
            -o "$FILE_NAME" "$URL"

          # Setup LKM source
          curl -fsSL \
            https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh |
            bash

          mkdir -p fs/nomount

          # Build module
          CONFIG_NOMOUNT=m make M="$(pwd)/fs/nomount" modules

          # test
          llvm-readelf -SW "$(pwd)/fs/nomount/nomount.ko" | grep -Ei 'plt|trampoline'

          # Repack
          TMP_NOMOUNT="tmpNoMount"

          SRC_ZIP=$(find . -maxdepth 1 -name 'NoMount*.zip' -print -quit)

          [ -n "$SRC_ZIP" ] || {
            echo "NoMount ZIP not found!"
            exit 1
          }

          NEW_NAME="$(basename "$SRC_ZIP" .zip)_LongKernel"

          rm -rf "$TMP_NOMOUNT"
          mkdir -p "$TMP_NOMOUNT"

          unzip -o "$SRC_ZIP" -d "$TMP_NOMOUNT"

          mkdir -p "$TMP_NOMOUNT/lkm"

          cp fs/nomount/nomount.ko \
            "$TMP_NOMOUNT/lkm/nomount-4.14.ko"

          (
            cd "$TMP_NOMOUNT"
            zip -r "../${NEW_NAME}.zip" .
          )

          rm -rf "$TMP_NOMOUNT"

          ZIP_FILE="${NEW_NAME}.zip"

          [ -f "$ZIP_FILE" ] || {
            echo "NoMount ZIP not found!"
            exit 1
          }

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Upload NoMount to Telegram
        working-directory: repo
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SAVE_FILE: ${{ secrets.TELEGRAM_SAVE_FILE }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          set -euo pipefail

          [ -f "$ZIP_FILE" ] || {
            echo "NoMount ZIP not found!"
            exit 1
          }

          echo "Uploading $ZIP_FILE to Telegram..."

          curl -fsS -X POST \
            "https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendDocument" \
            -F "chat_id=${{ env.CHAT_ID }}" \
            -F "document=@${ZIP_FILE}" \
            -o response.json

          cat > payload.json <<EOF
          {
            "response": $(cat response.json),
            "sha256": ""
          }
          EOF

          curl -X POST "${{ env.SAVE_FILE }}" \
            -H "Content-Type: application/json" \
            -d @payload.json

          echo "Upload completed successfully"
